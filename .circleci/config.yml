version: 2.1

references:
  RUBY_IMAGE: &RUBY_IMAGE
    cimg/ruby:3.4.12
  MACOS_CACHE_KEY: &MACOS_CACHE_KEY
    v4-{{ checksum "setup" }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
  RUBY_CACHE_KEY: &RUBY_CACHE_KEY
    v2-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}

orbs:
  teak: teak/sdk-utils@1
  buildomat: teak/buildomat@0.1

commands:
  # Installs the Ruby named in .ruby-version when the image doesn't ship it, then
  # fails the job unless that is the Ruby actually running.
  ruby_setup:
    description: "Run the Ruby pinned in .ruby-version"
    steps:
      - run:
          name: Ruby Setup
          command: |
            want=$(sed 's/^ruby-//' .ruby-version)
            if ! ruby -v 2>/dev/null | grep -q "^ruby ${want} "; then
              brew update --quiet || true
              if command -v rbenv >/dev/null; then
                brew upgrade ruby-build || true
                rbenv install -s "${want}"
                echo "export RBENV_VERSION=${want}" >> "$BASH_ENV"
                echo 'eval "$(rbenv init -)"' >> "$BASH_ENV"
                export RBENV_VERSION="${want}"
                eval "$(rbenv init -)"
              else
                brew upgrade ruby-install || brew install ruby-install
                ruby-install --no-reinstall ruby "${want}"
                echo "source /opt/homebrew/share/chruby/chruby.sh; chruby ruby-${want}" >> "$BASH_ENV"
                source /opt/homebrew/share/chruby/chruby.sh
                chruby "ruby-${want}"
              fi
            fi
            ruby -v
            ruby -v | grep -q "^ruby ${want} "

jobs:
  build:
    macos:
      xcode: "14.3.1"
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - checkout
      - ruby_setup
      - run: git fetch --tags
      - restore_cache:
          key: *MACOS_CACHE_KEY
      - run:
          name: Ruby Gems
          command: |
            bundle config set --local path vendor/bundle
            bundle check || bundle install
      - save_cache:
          paths:
            - ~/Library/Caches/Homebrew
            - vendor/bundle
          key: *MACOS_CACHE_KEY
      - run:
          name: Build Teak SDK
          command: |
            bundle exec rake
            mkdir build
            mv Teak.unitypackage build/Teak.unitypackage
      - run:
          name: Compute Checksum
          command: |
            shasum -a512 build/Teak.unitypackage > build/Teak.unitypackage.sha512
      - run:
          name: Build UPM Package
          command: |
            git submodule init && git submodule update --recursive
            UPM_BUILD_TEMP=upm-build bundle exec rake upm:build
      - persist_to_workspace:
          root: .
          paths:
            - build/*
            - upm-build/*
      - teak/build-antora-playbook:
          build_type: development

  tag_build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - teak/tag-promote

  deploy_versioned:
    docker:
      - image: *RUBY_IMAGE
    steps:
      - checkout
      - run: git fetch --tags
      - restore_cache:
          key: *RUBY_CACHE_KEY
      - run:
          name: Ruby Gems
          command: |
            bundle config set --local path vendor/bundle
            bundle check || bundle install
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get -y -qq install awscli
      - save_cache:
          paths:
            - vendor/bundle
          key: *RUBY_CACHE_KEY
      - attach_workspace:
          at: .
      - run:
          name: Deploy UPM to Git Repo
          command: UPM_BUILD_TEMP=upm-build UPM_PACKAGE_REPO=upm-package-teak bundle exec rake upm:deploy_versioned
      - persist_to_workspace:
          root: .
          paths:
            - build/*
            - upm-package-teak/*
      - buildomat/aws-oidc-assume
      - run:
          name: Upload SDK to S3
          command: |
            aws s3 cp build/Teak.unitypackage s3://teak-build-artifacts/unity/Teak-$(git describe --tags --always).unitypackage --acl public-read
            aws s3 cp build/Teak.unitypackage.sha512 s3://teak-build-artifacts/unity/Teak-$(git describe --tags --always).unitypackage.sha512 --acl public-read

  deploy_latest:
    docker:
      - image: *RUBY_IMAGE
    steps:
      - checkout
      - run: git fetch --tags
      - restore_cache:
          key: *RUBY_CACHE_KEY
      - run:
          name: Ruby Gems
          command: |
            bundle config set --local path vendor/bundle
            bundle check || bundle install
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get -y -qq install awscli
      - save_cache:
          paths:
            - vendor/bundle
          key: *RUBY_CACHE_KEY
      - attach_workspace:
          at: .
      - run:
            name: Update UPM Branch Heads
            command: |
              UPM_PACKAGE_REPO=upm-package-teak bundle exec rake upm:deploy_latest
      - buildomat/aws-oidc-assume
      - run:
          name: Upload SDK to S3
          command: |
            aws s3 cp build/Teak.unitypackage s3://teak-build-artifacts/unity/Teak.unitypackage --acl public-read
            aws s3 cp build/Teak.unitypackage.sha512 s3://teak-build-artifacts/unity/Teak.unitypackage.sha512 --acl public-read
workflows:
  un-tagged-build:
    jobs:
      - build:
          context:
            - Antora
          filters:
            tags:
              ignore: /.*/
      - tag_build:
          requires:
            - build
          filters:
            tags:
              ignore: /.*/

  tagged-build:
    jobs:
      - build:
          context:
            - Antora
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_versioned:
          context:
            - AWS-OIDC-Role
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - hold:
          type: approval
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_latest:
          context:
            - AWS-OIDC-Role
          requires:
            - hold
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
