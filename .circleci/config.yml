version: 2.1

references:
  RUBY_IMAGE: &RUBY_IMAGE
    cimg/ruby:3.4.12
  MACOS_CACHE_KEY: &MACOS_CACHE_KEY
    v4-{{ checksum "setup" }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
  # The 2022.3 floor (MIN_VERSIONS.yml min-unity), so the tests also catch use of newer APIs.
  UNITY_EDITOR_IMAGE: &UNITY_EDITOR_IMAGE
    unityci/editor:ubuntu-2022.3.62f3-base-3.2.2
  RUBY_CACHE_KEY: &RUBY_CACHE_KEY
    v2-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}

orbs:
  teak: teak/sdk-utils@1
  buildomat: teak/buildomat@0.1

commands:
  # Runs the Ruby named in .ruby-version. The image's rbenv doesn't have it, so it is built
  # once per image and cached; the job fails unless that is the Ruby actually running.
  ruby_setup:
    description: "Run the Ruby pinned in .ruby-version"
    parameters:
      xcode-version:
        type: string
        default: "16.4.0"
    steps:
      - restore_cache:
          key: v2-ruby-<< parameters.xcode-version >>-{{ checksum ".ruby-version" }}
      - run:
          name: Ruby Setup
          command: |
            want=$(sed 's/^ruby-//' .ruby-version)
            versions="$(rbenv root)/versions"
            cache="$HOME/ruby-cache"
            if [ -d "${cache}/${want}" ]; then
              mkdir -p "${versions}"
              cp -R "${cache}/${want}" "${versions}/${want}"
            else
              brew update --quiet || true
              brew upgrade ruby-build || true
              # Link the image's own openssl: ruby-build would otherwise link the newest
              # brew openssl, which a cache-restored Ruby won't find on a fresh image.
              brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
              RUBY_CONFIGURE_OPTS="--with-openssl-dir=$(brew --prefix openssl@3)" rbenv install -s "${want}"
              mkdir -p "${cache}"
              cp -R "${versions}/${want}" "${cache}/${want}"
            fi
            # Later steps pick this Ruby up through BASH_ENV.
            shims="$(rbenv root)/shims"
            echo "export RBENV_VERSION=${want}; export PATH=${shims}:\$PATH" >> "$BASH_ENV"
            export RBENV_VERSION="${want}" PATH="${shims}:${PATH}"
            rbenv rehash
            ruby -v
            ruby -v | grep -q "^ruby ${want} "
            ruby -ropenssl -ryaml -e 1
      - save_cache:
          paths:
            - ~/ruby-cache
          key: v2-ruby-<< parameters.xcode-version >>-{{ checksum ".ruby-version" }}
  fetch_release_artifacts:
    description: "Fetch tags, gems, the build workspace and AWS credentials for a deploy job"
    steps:
      - checkout
      - run: git fetch --tags
      - restore_cache:
          key: *RUBY_CACHE_KEY
      - run:
          name: Ruby Gems
          command: |
            bundle config set --local path vendor/bundle
            bundle check || bundle install
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get -y -qq install awscli
      - save_cache:
          paths:
            - vendor/bundle
          key: *RUBY_CACHE_KEY
      - attach_workspace:
          at: .
      - buildomat/aws-oidc-assume
  # Uploads the unitypackage to s3://teak-build-artifacts/<prefix>/. The prefix is always a
  # literal at the call site, never a variable, so a dev run can't write a release key.
  upload_sdk:
    description: "Upload the unitypackage to S3"
    parameters:
      prefix:
        type: string
      versioned:
        type: boolean
    steps:
      - run:
          name: Upload SDK to S3
          command: |
            if [ "<< parameters.versioned >>" = "true" ]; then
              SFX="-$(git describe --tags --always)"
            else
              SFX=""
            fi
            DEST="s3://teak-build-artifacts/<< parameters.prefix >>"
            aws s3 cp build/Teak.unitypackage ${DEST}/Teak${SFX}.unitypackage --acl public-read
            aws s3 cp build/Teak.unitypackage.sha512 ${DEST}/Teak${SFX}.unitypackage.sha512 --acl public-read
jobs:
  build:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - checkout
      - ruby_setup
      - run: git fetch --tags
      - restore_cache:
          key: *MACOS_CACHE_KEY
      - run:
          name: Ruby Gems
          command: |
            bundle config set --local path vendor/bundle
            bundle check || bundle install
      - save_cache:
          paths:
            - ~/Library/Caches/Homebrew
            - vendor/bundle
          key: *MACOS_CACHE_KEY
      - run:
          name: Build Teak SDK
          command: |
            bundle exec rake
            mkdir build
            mv Teak.unitypackage build/Teak.unitypackage
      - run:
          name: Compute Checksum
          command: |
            shasum -a512 build/Teak.unitypackage > build/Teak.unitypackage.sha512
      - run:
          name: Build UPM Package
          command: |
            git submodule init && git submodule update --recursive
            UPM_BUILD_TEMP=upm-build bundle exec rake upm:build
      - persist_to_workspace:
          root: .
          paths:
            - build/*
            - upm-build/*
      - teak/build-antora-playbook:
          build_type: development

  changelog_check:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Check changelog fragments
          command: |
            yarn install --immutable
            yarn changelog check

  # Editor tests need a licensed Unity; the license (UNITY_LICENSE, a base64 ULF) comes from the Unity context.
  test:
    docker:
      - image: *UNITY_EDITOR_IMAGE
    resource_class: large
    steps:
      - checkout
      - run:
          name: Editor tests
          command: script/editor-tests
          no_output_timeout: 30m
      - store_artifacts:
          path: unity.test.log
          when: always

  tag_build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - teak/tag-promote

  deploy_versioned:
    docker:
      - image: *RUBY_IMAGE
    steps:
      - fetch_release_artifacts
      - run:
          name: Deploy UPM to Git Repo
          command: UPM_BUILD_TEMP=upm-build UPM_PACKAGE_REPO=upm-package-teak bundle exec rake upm:deploy_versioned
      - persist_to_workspace:
          root: .
          paths:
            - build/*
            - upm-package-teak/*
      - upload_sdk:
          prefix: unity
          versioned: true

  deploy_latest:
    docker:
      - image: *RUBY_IMAGE
    steps:
      - fetch_release_artifacts
      - run:
          name: Update UPM Branch Heads
          command: |
            UPM_PACKAGE_REPO=upm-package-teak bundle exec rake upm:deploy_latest
      - upload_sdk:
          prefix: unity
          versioned: false

  # Dry run of deploy_versioned: same UPM branch handling, but every push is `git push
  # --dry-run` and the S3 prefix is a literal unity/dev/ (expired by a bucket lifecycle rule
  # after 7 days). Also publishes the build to the UPM dev branch for CIRCLE_BRANCH (see UPM_DEV_BRANCHES), never a tag.
  deploy_dev:
    docker:
      - image: *RUBY_IMAGE
    steps:
      - fetch_release_artifacts
      - run:
          name: Dry-run UPM versioned deploy
          command: UPM_DRY_RUN=1 UPM_BUILD_TEMP=upm-build UPM_PACKAGE_REPO=upm-package-teak-dryrun bundle exec rake upm:deploy_versioned
      - run:
          name: Publish UPM dev branch
          command: UPM_BUILD_TEMP=upm-build UPM_PACKAGE_REPO=upm-package-teak-dev bundle exec rake upm:deploy_dev
      - upload_sdk:
          prefix: unity/dev
          versioned: true

  docs:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install Doxygen
          command: sudo apt-get update && sudo apt-get install -y doxygen
      - run:
          name: Build API docs
          command: yarn install --immutable && yarn docs

workflows:
  un-tagged-build:
    jobs:
      - build:
          context:
            - Antora
          filters:
            tags:
              ignore: /.*/
      - changelog_check:
          filters:
            tags:
              ignore: /.*/
      - test:
          context:
            - Unity
          filters:
            tags:
              ignore: /.*/
      - tag_build:
          requires:
            - build
            - changelog_check
            - test
          filters:
            tags:
              ignore: /.*/
      - docs:
          filters:
            tags:
              ignore: /.*/
      # Dry runs of the release steps after build. Parallel to tag_build and not required by
      # it: a failure turns the workflow red but doesn't block promote-tag creation.
      - deploy_dev:
          context:
            - AWS-OIDC-Role
          requires:
            - build
          filters:
            tags:
              ignore: /.*/

  tagged-build:
    jobs:
      - build:
          context:
            - Antora
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_versioned:
          context:
            - AWS-OIDC-Role
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - hold:
          type: approval
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_latest:
          context:
            - AWS-OIDC-Role
          requires:
            - hold
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
