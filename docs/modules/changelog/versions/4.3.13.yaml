new:
  - "Add ``Teak.LiveActivity.RegisterPushToStartToken`` to report a Live Activity push-to-start token to Teak."
  - "Add web push registration for WebGL via ``RegisterForNotifications`` — host page must register ``/sw.js`` as the service worker."
bug:
  - "WebGL: Multiple notifications scheduled in the same frame now all complete correctly."
  - "iOS: Fixed the Teak rich-push notification extensions using the wrong version number, which could cause App Store upload rejections."
  - "iOS: Fixed a rare multi-threaded crash involving session handling."
  - "Android: Reward claims no longer hang on an empty or malformed server response."
  - "Android: Improved handling of malformed (non-JSON) server responses in network requests, which now degrade gracefully."
  - "Android: Universal links with malformed resolutions now keep their originating launch link for attribution instead of dropping it."
  - "Android: Improved handling of deep links containing an unencoded ``%`` (e.g. a ``50%`` creative or schedule name), which now route correctly."
  - "Android: Fixed a crash and incorrect sandbox/production purchase classification when using the Amazon Appstore SDK 3.x."
enhancement:
  - "Improved internal error reporting."
